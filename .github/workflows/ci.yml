name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  service:
    name: Service (Python) — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  connector:
    name: Connector (TypeScript) — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  provisioning:
    name: Provisioning — render check (no drift, valid)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install service (render.py reuses its env/dir parsing)
        run: pip install -e ./service
      - name: Validate + fail on drift
        run: python provisioning/render.py --check

[project]
name = "meridian-usage-service"
version = "0.1.0"
description = "Meridian Life Sciences — AI usage & admin service (Part A)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",            # FastAPI TestClient transport
]

[project.scripts]
meridian-service = "meridian_service.api:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["meridian_service*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
